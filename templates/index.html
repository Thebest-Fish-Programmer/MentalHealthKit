<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaberCat Project 101 | Home</title>
    <link rel="shortcut icon" href="/static/Images/TopLogo.png" type="image/png">
    <style>
        /* Background */
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            background: radial-gradient(circle at top left, #165425, #0a2414 70%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
        }

        /* Glass card */
        .glass {
            width: 90%;
            max-width: 700px;
            padding: 40px;
            border-radius: 24px;

            /* Glass effect */
            background: linear-gradient(135deg,
                    rgba(255, 255, 255, 0.25),
                    rgba(255, 255, 255, 0.05));
            backdrop-filter: blur(18px) saturate(160%);
            -webkit-backdrop-filter: blur(18px) saturate(160%);

            /* Depth */
            border: 1px solid rgba(255, 255, 255, 0.35);
            box-shadow:
                0 20px 40px rgba(0, 0, 0, 0.45),
                inset 0 1px 1px rgba(255, 255, 255, 0.35);

            text-align: center;
        }

        /* Title */
        h1 {
            margin-top: 0;
            font-size: 2.2rem;
            letter-spacing: 0.5px;
        }

        /* Paragraph */
        p {
            font-size: 1.1rem;
            opacity: 0.9;
            margin: 20px 0 35px;
        }

        /* Buttons container */
        .buttons {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* Glass buttons */
        .glass-btn {
            padding: 14px 26px;
            border-radius: 14px;
            background: linear-gradient(135deg,
                    rgba(255, 255, 255, 0.35),
                    rgba(255, 255, 255, 0.1));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow:
                inset 0 1px 1px rgba(255, 255, 255, 0.4),
                0 8px 18px rgba(0, 0, 0, 0.35);

            color: white;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .glass-btn:hover {
            transform: translateY(-3px);
            background: linear-gradient(135deg,
                    rgba(255, 255, 255, 0.5),
                    rgba(255, 255, 255, 0.15));
            box-shadow:
                inset 0 1px 1px rgba(255, 255, 255, 0.5),
                0 12px 28px rgba(0, 0, 0, 0.45);
        }
    </style>
</head>

<body>
    <div class="glass">
        <img src="/static/Images/TopLogo.png" alt="SaberCat Logo" style="width:150px;height:auto;margin-bottom:20px;">
        <h1>Welcome to SaberCat Project 101</h1>
        <h3>by Ashvath Gupta</h3>

        <p>
            This is the home page of the SaberCat Project 101 application.
        </p>

        <div class="buttons">
            <a class="glass-btn" href="/MentalHealthToolKit">
                Go to Mental Health Tool Kit
            </a>

            <a class="glass-btn" href="/ExecutiveFunctuoningToolKit">
                Executive Functioning Tool Kit
            </a>
        </div>
    </div>
</body>

</html>
